name: Build Windows beta
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile app and installer
        shell: pwsh
        run: ./Build-Installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HaloStudio-Windows
          path: |
            build/HaloStudio-Setup-*.exe
            build/*.sha256
      - name: Self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./Halo.exe -ArgumentList '--self-test', "$PWD\build\self-test" -Wait -PassThru
          Get-Content build/self-test/self-test.txt
          if ($p.ExitCode -ne 0) { throw 'The self-test reported a failure.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-test
          path: build/self-test
      # A ready-to-run installer for every build of main, downloadable as a plain .exe (artifacts are always zipped).
      # Its tag is not a version number, so installed copies never take it for an update.
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dernier-build --cleanup-tag --yes *> $null
          $global:LASTEXITCODE = 0
          $version = (Select-String -Path BuildInfo.cs -Pattern 'Version="([^"]+)"').Matches[0].Groups[1].Value
          $files = Get-ChildItem build/HaloStudio-Setup-*.exe,build/*.sha256 | ForEach-Object FullName
          gh release create dernier-build @files --target $env:GITHUB_SHA --prerelease --title "Halo Studio $version - dernier build" --notes "Installateur du dernier build de la branche principale ($($env:GITHUB_SHA.Substring(0,7))). Version d'essai : elle n'est pas proposée en mise à jour automatique."
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the latest build failed.' }
      - name: Publish tagged beta
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path BuildInfo.cs -Pattern 'Version="([^"]+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version differ.' }
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'This release is already published.'; exit 0 }
          $files = Get-ChildItem build/HaloStudio-Setup-*.exe,build/*.sha256 | ForEach-Object FullName
          gh release create $env:GITHUB_REF_NAME @files --title "Halo Studio $version" --prerelease --generate-notes
